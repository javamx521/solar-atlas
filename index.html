<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05080f">
<meta name="description" content="在星光之间探索太阳、八大行星与冥王星。一个安静、沉浸、可交互的三维太阳系。">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>Solar Atlas · 太阳系图谱</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<main id="stage"><canvas id="spaceCanvas" tabindex="0" aria-label="三维太阳系，方向键切换天体，R 复位"></canvas></main>
<div class="vignette" aria-hidden="true"></div>
<div class="loading" id="loading" role="status" aria-live="polite"><div class="loader-orbit" aria-hidden="true"><i></i></div><div class="load-brand">SOLAR ATLAS</div><p id="loadstatus">正在展开太阳系…</p><div class="loadbar"><i id="loadfill"></i></div></div>
<header class="masthead">
  <button class="brand" id="homeButton" aria-label="返回太阳系总览"><span class="brand-mark" aria-hidden="true">◉</span><span>SOLAR ATLAS<small>太阳系图谱</small></span></button>
  <nav class="view-switch" aria-label="观察视角"><button class="seg active" data-view="perspective">三维探索</button><button class="seg" data-view="side">行星排列</button><button class="seg" data-view="live">今日星位</button></nav>
  <div class="tools"><button class="iconbtn" id="searchToggle" aria-label="搜索天体" title="搜索 /"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><button class="utilitybtn" id="musicToggle" aria-pressed="false" title="环境音">♪<span>声音</span></button><button class="utilitybtn" id="langToggle" aria-label="Switch to English">EN</button><button class="iconbtn" id="helpToggle" aria-label="操作指南">?</button></div>
</header>
<section class="scene-intro" id="sceneIntro" aria-label="太阳系介绍"><div class="eyebrow"><span class="live-dot"></span><span id="introEyebrow">我们的宇宙坐标</span></div><h1 id="introTitle">在群星之间</h1><p id="introDescription">一颗恒星，八大行星。<br>从熟悉的蓝色家园，出发。</p><button class="explore-button" id="exploreEarth"><span id="exploreLabel">探索地球</span><span aria-hidden="true"><svg class="arrow-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16 16 4M5 4h11v11"/></svg></span></button><div class="intro-index"><span>01 — 10</span><span id="introIndexLabel">天体档案</span></div></section>
<div class="scene-meta"><span id="sceneCaption">太阳系 · 示意尺度</span><span class="meta-rule"></span><span id="sceneStatus">3D EXPLORER</span></div>
<div class="scene-controls" role="group" aria-label="场景控制"><button class="iconbtn" id="zoomIn" aria-label="放大" title="放大">+</button><button class="iconbtn" id="zoomOut" aria-label="缩小" title="缩小">−</button><span class="control-separator"></span><button class="iconbtn" id="resetView" aria-label="复位视角" title="复位 R">⌂</button><button class="iconbtn active" id="autoToggle" aria-label="自动环绕" aria-pressed="true" title="自动环绕">⟳</button><button class="iconbtn active" id="layersToggle" aria-label="显示轨道" aria-pressed="true" title="轨道线">◎</button></div>
<div class="planet-dock"><div class="dock-caption"><span id="dockLabel">选择一个世界</span><span id="dockHint">拖动旋转 · 滚轮缩放</span></div><nav id="planetBar" class="planet-bar" aria-label="天体导航"></nav></div>
<aside class="drawer" id="drawer" aria-labelledby="drawerTitle" aria-hidden="true" inert>
 <div class="drawer-head"><span id="drawerTag" class="eyebrow">PLANETARY DOSSIER</span><button class="close iconbtn" id="closeDrawer" aria-label="关闭天体档案">×</button></div>
 <div class="drawer-identity"><div class="body-number" id="bodyNumber">03</div><h2 id="drawerTitle">地球<small>EARTH</small></h2><p class="body-class" id="bodyClass">类地行星</p></div><div class="drawer-body" id="drawerBody"></div>
 <div class="drawer-nav"><button id="previousBody" aria-label="上一个天体">← <span>上一个</span></button><button id="nextBody" aria-label="下一个天体"><span>下一个</span> →</button></div>
</aside>
<div class="search-overlay" id="searchOverlay" hidden><section class="search-panel" role="dialog" aria-modal="true" aria-labelledby="searchTitle"><div class="search-heading"><h2 id="searchTitle">你想去哪里？</h2><button class="close iconbtn" id="closeSearch" aria-label="关闭搜索">×</button></div><div class="search-field"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索天体，中英文或拼音…" aria-label="搜索天体" role="combobox" aria-autocomplete="list" aria-controls="results" aria-expanded="true"></div><div class="results" id="results" role="listbox" aria-label="天体搜索结果"></div><p class="search-note" id="searchNote">↑ ↓ 选择　Enter 前往　Esc 关闭</p></section></div>
<div class="guide" id="guide" hidden><section class="guide-panel" role="dialog" aria-modal="true" aria-labelledby="guideTitle"><div class="guide-head"><div><span class="eyebrow">FLIGHT MANUAL</span><h2 id="guideTitle">轻轻拖动，开始探索。</h2></div><button class="close iconbtn" id="guideX" aria-label="关闭操作指南">×</button></div><div class="guide-grid" id="guideGrid"></div><p class="scale-note" id="scaleNote"></p><button class="explore-button" id="guideClose">开始探索 <span aria-hidden="true"><svg class="arrow-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16 16 4M5 4h11v11"/></svg></span></button></section></div>
<div class="fallback" id="fallback" hidden><p id="fallbackMessage">当前设备无法呈现三维场景，天体档案仍可浏览。</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div class="noscript">请启用 JavaScript 以探索三维太阳系。Enable JavaScript to explore Solar Atlas.</div></noscript>
<script src="vendor/three.min.js" defer></script>
<script src="src/atlas.js" defer></script>
<script src="src/scene.js" defer></script>
<script src="src/boot.js" defer></script>
</body>
</html>
